[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    security: Security-critical tests that must always pass
    idor: Tests for Insecure Direct Object Reference vulnerabilities
    revocation: Tests for immediate access revocation
    audit: Tests for audit log integrity
    negative: Tests that verify security controls are active (must fail if controls removed)
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
